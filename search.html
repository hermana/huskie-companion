
<!DOCTYPE html>
<html>
<head>
	<title>Mock IPortal</title>
	<link rel="stylesheet" type="text/css" href="src/clippy.css" media="all">
	<link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
	<link href="google-search.css" rel="stylesheet" type="text/css"/>
	
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js" type="text/javascript"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js" type="text/javascript"></script>
	<script src="avataaars.js"></script>

</head>
<body >

<div class="container">
	<div class="col-md-12 ct-content">
                        
		<form id="searchForm" action="">
			<div class="row">
				<div class="col-md-10 col-sm-12">
					<input id="txtSearchTerm" name="q" class="search-page-search" placeholder="What are you looking for?" value="">
				</div>
				<div class="col-md-2 col-sm-12">
					<input type="submit" class="search-page-search-submit" value="Search">
				</div>
			</div>
		</form>
		<div id="searchResult"></div>
		<div id="output"></div>
		<div class="pager_controls">
			<p>
				<a onclick="documentTrack('#');" href="#" id="lnkPrev" title="Display previous result page" style="display:none;">Previous</a> <a onclick="documentTrack('#');" href="#" id="lnkNext" title="Display next result page" style="display:none;">Next</a>
			</p>
		</div>
		
		<!-- Number of searches per day will be limited unless google_api_key is specified (https://console.developers.google.com) -->
		<!-- private.js contains API keys for custom search -->
		<script src="private.js" type="text/javascript"></script>
		<script src="search-script.js" type="text/javascript"></script>
		<script type="text/javascript">
			var searchTerm = GetURLParameter('q');
			$('#txtSearchTerm').val(searchTerm);
			Search($("#txtSearchTerm").val(),0);
			
			function GetURLParameter(sParam){
					var sPageURL = window.location.search.substring(1);
					var sURLVariables = sPageURL.split('&');
					for (var i = 0; i < sURLVariables.length; i++) 
					{
							var sParameterName = sURLVariables[i].split('=');
							if (sParameterName[0] == sParam) 
							{
									return sParameterName[1];
							}
					}
			}
		</script>
		<script src="http://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js" type="text/javascript"></script>

		<!-- Clippy.js -->
		<script src="build/clippy.js"></script>

		<!-- Init script -->
		<script type="text/javascript">
			clippy.load('Rover', function(agent){
				// do anything with the loaded agent
				agent.show();
			});
		</script>
		<script type="text/javascript">	
			//FIXME: where should this go? 
			var svg = Avataaars.create({
				skin: "tanned",
				top: "shortWaved",
				hairColor: "auburn",
				hatColor: "blue02",
				accessories: "none",
				accessoriesColor: "black",
				facialHair: "none",
				facialHairColor: "auburn",
				clothing: "shirtCrewNeck",
				clothingGraphic: "pizza",
				clothingColor: "black",
				eyes: "default",
				eyebrows: "defaultNatural",
				mouth: "default",
				width: 200,
				height: 200
			});
		</script>
		<svg></svg>	
    </div>
</div>	

</body>
</html>
